<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
  color:white;

  background:linear-gradient(
    135deg,
    #000000,
    #0f0f0f,
    #1a1a1a,
    #050505
  );

  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
}

/* Animated Background */

@keyframes bgMove{
  0%{
    background-position:0% 50%;
  }
  50%{
    background-position:100% 50%;
  }
  100%{
    background-position:0% 50%;
  }
}

.bg{
  position:absolute;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:0;
}

.circle{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(5px);
  animation:float 10s linear infinite;
}

.circle:nth-child(1){
  width:240px;
  height:240px;
  top:8%;
  left:-70px;
}

.circle:nth-child(2){
  width:180px;
  height:180px;
  bottom:10%;
  right:-50px;
}

.circle:nth-child(3){
  width:120px;
  height:120px;
  top:70%;
  left:40%;
}

@keyframes float{
  0%{
    transform:translateY(0px) rotate(0deg);
  }

  50%{
    transform:translateY(-20px) rotate(180deg);
  }

  100%{
    transform:translateY(0px) rotate(360deg);
  }
}

/* Card */

.card{
  position:relative;
  z-index:1;

  width:90%;
  max-width:430px;

  padding:35px;

  border-radius:28px;

  background:rgba(255,255,255,0.06);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,0.1);

  box-shadow:0 10px 40px rgba(0,0,0,0.5);

  text-align:center;
}

h1{
  font-size:32px;

  margin-bottom:8px;

  text-align:center;

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  line-height:1.2;

  word-break:break-word;
}

.bio{
  color:#d0d0d0;
  margin-bottom:28px;
  font-size:15px;
}

/* Social Buttons */

.social{
  position:relative;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

  width:100%;

  padding:16px;

  margin:14px 0;

  border-radius:16px;

  text-decoration:none;

  color:white;

  background:rgba(255,255,255,0.06);

  border:1px solid rgba(255,255,255,0.12);

  overflow:hidden;

  transition:0.25s;

  font-weight:bold;

  font-size:16px;
}

.social:hover{
  transform:translateY(-3px) scale(1.02);

  background:rgba(255,255,255,0.14);

  box-shadow:0 0 18px rgba(255,255,255,0.08);
}

/* Shine Effect */

.social::before{
  content:"";

  position:absolute;

  top:0;

  left:-120%;

  width:60%;

  height:100%;

  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.22),
    transparent
  );

  transform:skewX(-20deg);

  animation:shine 3s infinite;
}

@keyframes shine{
  0%{
    left:-120%;
  }

  100%{
    left:140%;
  }
}

/* Icons */

.icon{
  width:26px;
  height:26px;
  object-fit:contain;
}

/* Latest Video */

.latest-video{
  margin-top:28px;
}

.latest-video h2{
  font-size:22px;
  margin-bottom:14px;
}

#videoLink{

#thumbnail{

  border-radius:18px;
  margin-bottom:12px;
  transition:0.25s;
  border:1px solid rgba(255,255,255,0.08);
}

#thumbnail:hover{
  transform:scale(1.02);
}

#videoTitle{
  color:#d7d7d7;
  font-size:15px;
}

/* Footer */

.footer{
  margin-top:24px;
  color:#9e9e9e;
  font-size:13px;
}

<!-- YOUTUBE SCRIPT -->

<script>

/*
PUT YOUR CHANNEL ID BELOW
Example:
UCD4uw7A3cO-M8XAj_Q8BGLg
*/

const channelID = "UCD4uw7A3cO-M8XAj_Q8BGLg";

fetch(
`https://www.youtube.com/feeds/videos.xml?channel_id=${channelID}`
)

.then(response => response.text())

.then(str =>
new window.DOMParser().parseFromString(str, "text/xml")
)

.then(data => {

  const latestVideo =
  data.querySelector("entry");

  const title =
  latestVideo.querySelector("title").textContent;

  const videoId =
  latestVideo.querySelector("yt\\:videoId").textContent;

  const videoURL =
  `https://www.youtube.com/watch?v=${videoId}`;

  const thumbnailURL =
  `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;

  document.getElementById("videoTitle").textContent = title;

  document.getElementById("thumbnail").src = thumbnailURL;

  document.getElementById("videoLink").href = videoURL;

})

.catch(() => {

  document.getElementById("videoTitle").textContent =
  "Could not load latest video.";

});

</script>
